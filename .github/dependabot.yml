version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    groups:
      actions:
        patterns: ['*']
    # A release must be a week old before it is proposed, so a compromised
    # version is usually withdrawn before it can reach this repository.
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
  # The plugin crate's dependencies; the native example follows them.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    groups:
      cargo:
        patterns: ['*']
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
  # The guest bindings' development dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    groups:
      npm:
        patterns: ['*']
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
