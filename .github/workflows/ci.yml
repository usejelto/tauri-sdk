# Portable workflow: this component directory must be the repository root.
name: tauri checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      conformance:
        description: Run full conformance using the checked-in contracts pin
        type: boolean
        default: false
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: component-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CI: 'true'
  GOFLAGS: -mod=readonly
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Pinned npm packaging toolchain
        run: npm install --global npm@11.14.0 --ignore-scripts
      - name: Install verified contracts pin
        if: inputs.release || inputs.conformance
        run: python3 vendor/release-tools/release.py contracts
      - uses: actions/setup-go@v7
        if: inputs.release || inputs.conformance
        with:
          go-version-file: .contracts/go.mod
          cache: false
      - name: Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev librsvg2-dev patchelf xvfb
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Component tests and packages
        run: make test build package
      - name: Conformance twice
        if: inputs.release || inputs.conformance
        run: |
          make conformance JELTO_CONTRACTS_DIR="$GITHUB_WORKSPACE/.contracts"
          make conformance JELTO_CONTRACTS_DIR="$GITHUB_WORKSPACE/.contracts"
      - name: Native example
        run: |
          make example
          git restore -- example/package-lock.json
      - name: Verify shipping Cargo package
        if: inputs.release
        run: |
          git diff --exit-code
          cargo publish --dry-run --locked
          cargo package --locked
      - name: Prepare release artifacts
        if: inputs.release
        run: |
          python3 vendor/release-tools/release.py stage
          python3 vendor/release-tools/release.py smoke
      - uses: actions/upload-artifact@v7
        if: inputs.release
        with:
          name: release-${{ runner.os }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.release }}
        with:
          name: packages-${{ runner.os }}
          path: |
            artifacts/
            dist/*.zip
            dist/*.sha256
            *.tgz
          if-no-files-found: error
          retention-days: 14
