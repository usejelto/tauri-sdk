[[set]]
identifier = "collect"
description = "Allows the three collecting operations: track, onboarding and set_props. Grant to local application windows that only collect, when the app initializes from Rust through `JeltoExt::jelto().init` or `init_with_origin`. Script in such a window cannot init, read the install id, reset or disable."
permissions = ["allow-track", "allow-onboarding", "allow-set-props"]
